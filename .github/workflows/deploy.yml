name: Deploy with Docker Compose

on:
  push:
    branches:
      - main # Trigger deployment on push to main branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Backup .env file before checkout
        run: |
          if [ -f .env ]; then
            cp .env /tmp/.env.backup
            echo "✅ .env backed up"
          else
            echo "⚠️ No .env file to backup"
          fi
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Restore .env file after checkout
        run: |
          if [ -f /tmp/.env.backup ]; then
            cp /tmp/.env.backup .env
            echo "✅ .env restored"
            rm /tmp/.env.backup
          else
            echo "⚠️ No .env backup found, using .env.example"
            cp .env.example .env
          fi

      - name: Verify .env configuration
        run: |
          echo "📋 Checking .env file..."
          if [ -f .env ]; then
            echo "✅ .env exists"
            echo "🔍 NEXT_PUBLIC_API_URL=$(grep NEXT_PUBLIC_API_URL .env | cut -d '=' -f2)"
          else
            echo "❌ .env not found!"
            exit 1
          fi

      - name: Stop existing containers
        run: docker-compose down  # Removed -v to preserve MongoDB data

      - name: Remove unused Docker data
        run: docker system prune -a -f

      - name: Build and start new containers
        run: docker-compose up --build -d
