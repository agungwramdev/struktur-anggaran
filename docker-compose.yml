services:
  mongodb:
    image: mongo:7
    container_name: struktur-anggaran-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: struktur-anggaran
    volumes:
      - mongodb_data:/data/db
    networks:
      - struktur-anggaran-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: struktur-anggaran-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/struktur-anggaran
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-CHANGE_THIS_TO_A_SECURE_RANDOM_STRING}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - PBJ_API_USERNAME=${PBJ_API_USERNAME}
      - PBJ_API_PASSWORD=${PBJ_API_PASSWORD}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-10}
      - LOGIN_THROTTLE_LIMIT=${LOGIN_THROTTLE_LIMIT:-5}
    depends_on:
      - mongodb
    networks:
      - struktur-anggaran-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: struktur-anggaran-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - API_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - struktur-anggaran-network

volumes:
  mongodb_data:
    driver: local

networks:
  struktur-anggaran-network:
    driver: bridge
