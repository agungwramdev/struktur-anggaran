services:
  db:
    image: mongo:7
    container_name: struktur-anggaran-mongodb
    ports:
      - "27018:27017"  # Changed to 27018 to avoid conflict with other project
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=struktur-anggaran
    restart: always
    networks:
      - struktur-anggaran-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: struktur-anggaran-backend
    restart: unless-stopped
    ports:
      - "4001:3001"
    volumes:
      - export_data:/data/exports
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://db:27017/struktur-anggaran
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-CHANGE_THIS_TO_A_SECURE_RANDOM_STRING}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - PBJ_API_USERNAME=${PBJ_API_USERNAME}
      - PBJ_API_PASSWORD=${PBJ_API_PASSWORD}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-10}
      - LOGIN_THROTTLE_LIMIT=${LOGIN_THROTTLE_LIMIT:-5}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4000}
    depends_on:
      - db
    networks:
      - struktur-anggaran-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4001}
    container_name: struktur-anggaran-frontend
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      - NEXT_PUBLIC_CADDY_URL=${NEXT_PUBLIC_CADDY_URL:-http://localhost:4002}
      - API_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - struktur-anggaran-network

  caddy:
    image: caddy:2-alpine
    container_name: struktur-anggaran-caddy
    restart: unless-stopped
    ports:
      - "4002:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - export_data:/data/exports:ro
      - caddy_data:/data/caddy
      - caddy_config:/config
    environment:
      - CADDY_AUTH_USER=${CADDY_AUTH_USER:-admin}
      - CADDY_AUTH_HASH=${CADDY_AUTH_HASH:-$$2a$$14$$VgTeZHXpe2NwUHijZIZOzeP3WkNOB6XvDYbYv0X8kjVbf6US9kfdq}
    depends_on:
      - backend
    networks:
      - struktur-anggaran-network

volumes:
  mongodb_data:
    driver: local
  export_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  struktur-anggaran-network:
    driver: bridge
